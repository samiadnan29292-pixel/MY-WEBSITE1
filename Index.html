<!DOCTYPE html>
<html>

<head>

<title>Sami Profile</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#1e3a8a);

text-align:center;
padding:40px;
}

.container{
max-width:500px;
margin:auto;
background:#1e293b;
padding:35px;
border-radius:25px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h1{
font-size:40px;
color:cyan;
text-shadow:0 0 15px cyan;
margin-bottom:10px;
}

.role{
font-size:20px;
color:#cbd5e1;
margin-bottom:30px;
}

.box{
background:#0f172a;
padding:20px;

border-radius:15px;
}

h2{
color:#38bdf8;
margin-bottom:10px;
}

p{
line-height:1.8;
font-size:16px;
}

.buttons a{

padding:12px 20px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:12px;
transition:0.3s;
}

.buttons a:hover{
transform:scale(1.05);

color:black;
}

.footer{
